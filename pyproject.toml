[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cps-core"
version = "0.1.0"
description = "A Python library for viability-aware coordination and stabilization of autonomous dynamical systems."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0"
]

[tool.setuptools]
# Explicitly list the packages to prevent any setuptools find-discovery errors
packages = ["cps", "cps.core"]
